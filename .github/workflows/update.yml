name: Update GeoJSON from Google Sheets

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update-geojson]
    
permissions:
  contents: write

concurrency:
  group: update-geojson
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download Google Sheet CSV
        run: |
          curl -fsSL "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKTuZZfRlg2o9RIcYe-wKXfvX5RaBceAH0GaS0M3ewtBai3hW8MnVWdkzs5jWpopAsbyIUO-Wm_NWv/pub?gid=0&single=true&output=csv" -o data.csv

      - name: Run conversion script
        run: |
          rm -f data.geojson
          python scripts/csv_to_geojson.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "Update geojson from Google Sheets [skip ci]"
          git pull --rebase origin main
          git push origin main
